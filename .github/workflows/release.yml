name: Release

# Push a tag such as v1.2.0 to build the app, sign it with Developer ID,
# notarize it, publish it as a GitHub Release, and update the Homebrew cask.
# A tag with a suffix, such as v1.3.0-beta.1, becomes a pre-release and
# leaves the cask alone.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions):
#   TEAM_ID                    the Apple Developer Team ID
#   DEVELOPER_ID_P12           the "Developer ID Application" certificate with its private key,
#                              exported from Keychain Access as .p12: base64 -i cert.p12 | pbcopy
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting it
#   ASC_KEY_ID                 an App Store Connect API key, for notarizing
#   ASC_ISSUER_ID              (App Store Connect ▸ Users and Access ▸ Integrations)
#   ASC_KEY_P8                 the contents of the key's AuthKey_XXXX.p8 file
#   TAP_TOKEN                  a fine-grained GitHub token, owned by anyfikra, with "Contents: read and write"
#                              on the tap repository only

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAP_REPOSITORY: anyfikra/homebrew-tap
  XCODE: /Applications/Xcode_26.6.app

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE"

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          # the intermediate certificate, which an exported .p12 leaves out
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build and sign
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive -quiet \
            -project Macinroid.xcodeproj -scheme Macinroid -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Macinroid.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" OTHER_CODE_SIGN_FLAGS=--timestamp

          options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string developer-id" \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string Developer ID Application" \
            "$options"
          xcodebuild -exportArchive -quiet \
            -archivePath "$RUNNER_TEMP/Macinroid.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export"

          codesign --verify --strict --deep --verbose=2 "$RUNNER_TEMP/export/Macinroid.app"
          lipo -archs "$RUNNER_TEMP/export/Macinroid.app/Contents/MacOS/Macinroid"

      - name: Notarize
        id: notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/export/Macinroid.app"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          credentials=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/upload.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/upload.zip" "${credentials[@]}" --wait --timeout 45m --output-format json || true)"
          echo "$result"
          status="$(plutil -extract status raw -o - - <<< "$result" 2>/dev/null || echo unknown)"
          if [[ "$status" != "Accepted" ]]; then
            id="$(plutil -extract id raw -o - - <<< "$result" 2>/dev/null || true)"
            [[ -n "$id" ]] && xcrun notarytool log "$id" "${credentials[@]}"
            echo "::error::Notarization ended with status $status"
            exit 1
          fi

          # lets Gatekeeper check the app without going online
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"

          mkdir -p dist
          zip="dist/Macinroid-$VERSION.zip"
          ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          rm "$key"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ZIP: ${{ steps.notarize.outputs.zip }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # a run started again: replace the file of the earlier attempt
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            flags=(--title "Macinroid $VERSION" --generate-notes --verify-tag)
            [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "$ZIP" "${flags[@]}"
          fi

      - name: Update the Homebrew cask
        if: steps.version.outputs.prerelease == 'false'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.notarize.outputs.sha256 }}
        run: |
          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$tap"
          mkdir -p "$tap/Casks"
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$SHA256/g" "$GITHUB_WORKSPACE/.github/homebrew/macinroid.rb" > "$tap/Casks/macinroid.rb"
          ruby -c "$tap/Casks/macinroid.rb"

          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macinroid.rb
          if git diff --cached --quiet; then
            echo "The cask is already up to date."
            exit 0
          fi
          git commit -m "macinroid $VERSION"
          git push origin HEAD:main

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
