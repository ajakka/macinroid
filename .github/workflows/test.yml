name: Test

# Only changes to the app run the tests, so that edits elsewhere in the
# repository, such as the website, don't wait for a macOS runner.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      # The tests use a simulated phone and a fake MTP device, so no phone is needed.
      - name: Run the tests
        run: xcodebuild test -quiet -project Macinroid.xcodeproj -scheme Macinroid -destination 'platform=macOS'
